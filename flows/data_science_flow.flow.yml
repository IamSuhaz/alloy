# A DigiXT Alloy flow. Edit it in Alloy's flow editor: "layout" only places the boxes, and "compiled" is written
# by the editor from the rest (Alloy runs it only while it matches what is above it).
alloy: flow/1
name: data_science_flow

nodes:
- id: node_13
  type: input_data
  label: Input Data
  zone: default
  config:
    source: catalog
    volume_format: auto
    volume_header: true
    volume_multi_line: false
    catalog: transformed
    table: pitwall.telemetry_trusted
- id: node_14
  type: filter
  label: Filter
  zone: default
  config:
    filter_mode: Basic
    basic_operator: '='
    basic_column: team
    basic_value: Red Bull
- id: node_15
  type: output_data
  label: Output Data
  zone: default
  config:
    target: table
    volume_format: csv
    volume_single_file: false
    mode: overwrite
    create_namespace: true
    quality_gate: table
    table: data_science.red_bull_dataset
edges:
- node_13.out -> node_14.in
- node_14.true -> node_15.in

# where the boxes sit on the canvas
layout:
  node_13: [200, 264]
  node_14: [460, 264]
  node_15: [720, 264]

# generated by the flow editor from the nodes and edges above: do not edit
compiled:
  from: 89e7b04232fe94db
  ir: "{\"version\":\"1.0\",\"primary_input\":\"main\",\"inputs\":{\"main\":{\"id\":\"main\",\"node\":\"node_13\",\"table\":\"pitwall.telemetry_trusted\",\"catalog\":\"transformed\"}},\"outputs\":[{\"id\":\"node_15\",\"mode\":\"overwrite\",\"table\":\"data_science.red_bull_dataset\",\"create_namespace\":true,\"input_ref\":\"node_14\"}],\"steps\":[{\"op\":\"filter\",\"expr\":\"`team` = 'Red Bull'\",\"id\":\"node_14\",\"input_ref\":\"main\"}]}"
